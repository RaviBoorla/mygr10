# Cloudflare Pages configuration.
#
# Docs: https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
#
# Pages projects use pages_build_output_dir instead of main.
# Worker-only fields (main, routes) are not valid here and cause a hard error.

name = "mygr10"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Pages supports only "preview" and "production" named environments.
[env.preview]
name = "mygr10-preview"

[env.production]
name = "mygr10-production"

# --- Secrets -----------------------------------------------------------
#
# Set with `wrangler pages secret put NAME`.
#
#   CORS_ORIGIN      Allowed origin(s) for CORS
#   LOG_LEVEL        debug | info | warn | error

# --- Vars (non-secret) -------------------------------------------------
#
# [vars]
# LOG_LEVEL = "info"
# ENVIRONMENT = "production"

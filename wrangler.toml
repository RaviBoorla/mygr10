# Cloudflare Pages configuration.
#
# Docs: https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
#
# Pages projects use pages_build_output_dir instead of main.
# Worker-only fields (main, routes) are not valid here and cause a hard error.
#
# No Workers AI binding: /api/chat runs every provider (including Cloudflare)
# on the user's own credentials, so nothing is billed to the site owner.

name = "mygr10"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# Pages supports only "preview" and "production" named environments.
[env.preview]
name = "mygr10-preview"

[env.production]
name = "mygr10-production"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Pathing · Grade 10 &amp; 12 — Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg:      #FFFFFF;
  --surf:    #FFFFFF;
  --surf2:   #F5F7FB;
  --border:  #DCE3EF;
  --text1:   #0B1220;
  --text2:   #55647C;
  --text3:   #C4CEDD;
  --sci:     #0EA5E9;
  --com:     #059669;
  --hum:     #8B5CF6;
  --voc:     #EA7C1C;
  --bar-bg:  rgba(255,255,255,.94);
  --pan-bg:  rgba(255,255,255,.98);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text1);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden}

/* ── TOOLBAR ─────────────────────────────────────────────── */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 16px;
  background:var(--bar-bg);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
#back-link{
  font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text2);
  text-decoration:none;flex-shrink:0;padding:4px 8px;border:1px solid var(--border);
  border-radius:7px;transition:color .12s,border-color .12s;
}
#back-link:hover{color:var(--text1);border-color:var(--text2)}
#bar h1{
  font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;
  letter-spacing:-.02em;white-space:nowrap;color:var(--text1);flex-shrink:0;
}
#bar h1 em{font-style:normal;font-weight:400;opacity:.45}

#sw{position:relative;flex:1;min-width:130px;max-width:220px}
#sw svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}
#search{
  width:100%;padding:6px 10px 6px 28px;
  background:var(--surf);border:1px solid var(--border);border-radius:7px;
  font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text1);outline:none;
}
#search:focus{border-color:var(--text2)}
#search::placeholder{color:var(--text2)}

#chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  padding:4px 9px;border-radius:20px;font-size:11px;font-weight:500;
  font-family:'DM Sans',sans-serif;border:1px solid var(--border);
  background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--text2);color:var(--text1)}
.chip.on{border-color:transparent;color:#07090F}

#acts{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.act{
  padding:4px 9px;border-radius:7px;font-size:11px;font-family:'DM Mono',monospace;
  border:1px solid var(--border);background:var(--surf);color:var(--text2);cursor:pointer;
  transition:color .12s;white-space:nowrap;
}
.act:hover{color:var(--text1)}

/* ── TREE SCROLL AREA ────────────────────────────────────── */
#wrap{
  position:fixed;top:52px;left:0;right:340px;bottom:0;
  overflow-x:auto;overflow-y:auto;
  border-right:1px solid var(--border);
}
#inner{
  display:inline-block;
  transform-origin:top left;
  line-height:0;
}
#tsvg{display:block}

/* ── ZOOM ────────────────────────────────────────────────── */
#zc{
  position:fixed;bottom:18px;right:16px;z-index:200;
  display:flex;gap:4px;
}
.zb{
  width:30px;height:30px;background:var(--surf);border:1px solid var(--border);
  border-radius:7px;font-size:16px;line-height:30px;text-align:center;
  color:var(--text2);cursor:pointer;user-select:none;transition:color .1s;
}
.zb:hover{color:var(--text1)}

/* ── LEGEND ──────────────────────────────────────────────── */
#leg{
  position:fixed;bottom:18px;left:16px;z-index:200;
  background:var(--bar-bg);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:9px;
  padding:9px 12px;display:flex;flex-direction:column;gap:5px;
}
.li{display:flex;align-items:center;gap:7px;font-size:10.5px;font-family:'DM Mono',monospace;color:var(--text2)}
.ld{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ── DETAIL PANEL ────────────────────────────────────────── */
#det{
  position:fixed;top:52px;right:0;bottom:0;width:330px;z-index:199;
  background:var(--pan-bg);backdrop-filter:blur(18px);
  border-left:1px solid var(--border);
  padding:16px 14px;overflow-y:auto;
  transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
}
#det.open{transform:none}
#dclose{
  float:right;margin-top:-1px;
  background:var(--surf);border:1px solid var(--border);
  border-radius:5px;padding:3px 8px;font-size:10px;
  font-family:'DM Mono',monospace;color:var(--text2);cursor:pointer;
}
#dcrumb{font-size:10px;font-family:'DM Mono',monospace;color:var(--text2);line-height:1.8;margin-bottom:9px;padding-right:44px}
#det h2{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;text-wrap:balance;margin-bottom:2px;line-height:1.25}
.dsub{font-size:11px;font-family:'DM Mono',monospace;color:var(--text2);margin-bottom:12px}
.dlbl{font-size:9px;font-family:'DM Mono',monospace;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;margin-top:11px}
.dval{font-size:12px;color:var(--text1);line-height:1.55}
.dval.mono{font-family:'DM Mono',monospace;font-size:11px}
.dtags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.dtag{padding:2px 7px;border-radius:10px;font-size:9.5px;font-family:'DM Mono',monospace;border:1px solid var(--border);color:var(--text2)}
.dkids{font-size:11px;color:var(--text2);line-height:1.7}
.dpath{margin-top:14px;padding:9px 10px;background:var(--surf);border:1px solid var(--border);border-radius:7px;font-size:10.5px;font-family:'DM Mono',monospace;color:var(--text2);line-height:1.8}

/* Node hover */
.ngrp{cursor:pointer}
.ngrp:hover .nbg{filter:brightness(1.18)}

@media(prefers-reduced-motion:reduce){#det{transition:none}}
</style>
</head>

// ── INIT ──────────────────────────────────────────────────────────────────────
const TEXT_INK = { sci:'#0369A1', comm:'#047857', hum:'#6D28D9', voc:'#C2410C' };
const nodeOf = new Map();
function initTree(n, parent, sc) {
  n._parent = parent || null;
  n._sc = n.kind==='stream' ? n.id : (sc||'root');
  n._color = n.kind==='stream' ? n.color : (parent?._color || '#EEF2FF');
  n._colorText = TEXT_INK[n._sc] || '#111827';
  if(n.kind!=='stream' && n.kind!=='root') n._exp = n._exp || false;
  nodeOf.set(n.id, n);
  n.children?.forEach(c => initTree(c, n, n._sc));
}

function numList(arr){ return arr.map((x,i)=>`${i+1}. ${x}`).join('<br>'); }

// ── STATE & MATCH ─────────────────────────────────────────────────────────────
const S = { zoom:1, q:'', filters:new Set(), sel:null };

function searchText(n){
  return [n.label,n.sublabel,n.keywords,n.meta?.note,n.meta?.exams,n.meta?.salary,n.meta?.duration,(n.tags||[]).join(' ')]
    .filter(Boolean).join(' ').toLowerCase();
}
function matchQ(n,q){
  if(!q) return true;
  const tokens=q.toLowerCase().split(/\s+/).filter(Boolean);
  const txt=searchText(n);
  if(tokens.every(t=>txt.includes(t))) return true;
  return n.children?.some(c=>matchQ(c,q))||false;
}
function matchF(n,fs){
  if(!fs.size) return true;
  for(const f of fs){
    if(n.tags?.includes(f)) return true;
    if(n.children?.some(c=>matchF(c,new Set([f])))) return true;
  }
  return false;
}
function nodeOp(n){
  const qOk = !S.q || matchQ(n,S.q);
  const fOk = !S.filters.size || matchF(n,S.filters);
  return (qOk && fOk) ? 1 : 0.07;
}

// ── LAYOUT ────────────────────────────────────────────────────────────────────
const STEP  = 205;  // x distance between level left-edges
const NW    = 160;  // node width
const NH    = [46,40,34,30,27,25]; // node heights by depth
const ROW   = 40;   // slot height for leaf node
const PAD_X = 24;
const PAD_Y = 42;

function slotH(n){
  if(!n.children?.length||!n._exp) return ROW;
  return n.children.reduce((s,c)=>s+slotH(c),0);
}
function doLayout(n,x,topY,d){
  n._d=d; n._x=x;
  const h=slotH(n);
  n._y=topY+h/2;
  if(n.children?.length&&n._exp){
    let cy=topY;
    n.children.forEach(c=>{ doLayout(c,x+STEP,cy,d+1); cy+=slotH(c); });
  }
}
function maxX(n,cur=0){
  const x=n._x+NW; let m=Math.max(cur,x);
  if(n.children?.length&&n._exp) n.children.forEach(c=>{ m=maxX(c,m); });
  return m;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={}){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

const tsvg = document.getElementById('tsvg');
const inner = document.getElementById('inner');

function renderAll(){
  doLayout(T,PAD_X,PAD_Y,0);
  const tw = maxX(T)+PAD_X+10;
  const th = slotH(T)+PAD_Y*2+10;
  tsvg.setAttribute('width',tw);
  tsvg.setAttribute('height',th);
  tsvg.innerHTML='';

  const lg=el('g'); tsvg.appendChild(lg);
  const ng=el('g'); tsvg.appendChild(ng);

  function visit(n){
    if(n.children?.length&&n._exp){
      n.children.forEach(c=>{ drawLink(n,c,lg); visit(c); });
    }
    drawNode(n,ng);
  }
  visit(T);
  applyZoom();
}

function drawLink(p,c,g){
  const op=Math.min(nodeOp(p),nodeOp(c));
  const sw=Math.max(0.5,1.6-c._d*0.22);
  const px=p._x+NW, py=p._y;
  const cx=c._x,    cy=c._y;
  const mx=(px+cx)/2;
  g.appendChild(el('path',{
    d:`M${px},${py} C${mx},${py} ${mx},${cy} ${cx},${cy}`,
    fill:'none', stroke:c._color,
    'stroke-opacity': op*0.45,
    'stroke-width': sw
  }));
}

function drawNode(n,g){
  const d=Math.min(n._d,NH.length-1);
  const nh=NH[d];
  const x=n._x, y=n._y-nh/2;
  const color=n._color||'#EEF2FF';
  const ink=n._colorText||'#111827';
  const op=nodeOp(n);
  const hasCh=!!n.children?.length;
  const isSelected=n.id===S.sel;

  const grp=document.createElementNS(NS,'g');
  grp.classList.add('ngrp');
  grp.dataset.id=n.id;

  // Background
  let bgFill = n._d===0 ? '#EEF1F8' : n._d===1 ? color+'1c' : '#FFFFFF';
  const bgStroke = n._d===1 ? ink : (isSelected ? ink : '#DCE3EF');
  const bgSW = n._d===1 ? 1.5 : isSelected ? 1.5 : 1;

  const bg=el('rect',{
    x,y,width:NW,height:nh,rx:6,
    class:'nbg',
    fill:bgFill, stroke:bgStroke,
    'stroke-width':bgSW, opacity:op
  });
  grp.appendChild(bg);

  // Left accent stripe (depth > 0)
  if(n._d>0){
    grp.appendChild(el('rect',{x,y,width:3,height:nh,rx:3,fill:color,opacity:op}));
  }

  // Label
  const fs=[13.5,12,10.5,9.5,8.5,8][d];
  const fw=n._d<=1?'700':n._d===2?'600':'500';
  const hasSub=n.sublabel&&n._d<=3;
  const ty=hasSub ? y+nh*0.36 : y+nh/2;
  const avail=NW-14-(hasCh?14:0);
  const maxCh=Math.floor(avail/(fs*0.57));
  const lbl=n.label.length>maxCh ? n.label.slice(0,maxCh-1)+'…' : n.label;

  const t=el('text',{
    x:x+9, y:ty,
    'dominant-baseline':'central',
    fill: n._d===1?ink:'#111827',
    opacity:op,
    'font-family':"'Syne',sans-serif",
    'font-size':fs,'font-weight':fw
  });
  t.style.pointerEvents='none';
  t.textContent=lbl;
  grp.appendChild(t);

  if(hasSub){
    const ss=fs*0.73;
    const sub=el('text',{
      x:x+9, y:y+nh*0.68,
      'dominant-baseline':'central',
      fill:ink, opacity:op*0.85,
      'font-family':"'DM Mono',monospace",'font-size':ss
    });
    sub.style.pointerEvents='none';
    const subText=n.sublabel.length>24?n.sublabel.slice(0,23)+'…':n.sublabel;
    sub.textContent=subText;
    grp.appendChild(sub);
  }

  // Expand chevron
  if(hasCh){
    const chev=el('text',{
      x:x+NW-10, y:y+nh/2,
      'dominant-baseline':'central','text-anchor':'middle',
      fill:ink,opacity:op*0.8,
      'font-size':9,'font-family':'system-ui,sans-serif'
    });
    chev.style.pointerEvents='none';
    chev.textContent=n._exp?'▾':'▸';
    grp.appendChild(chev);
  }

  grp.addEventListener('click',e=>{ e.stopPropagation(); handleClick(n); });
  g.appendChild(grp);
}

// ── INTERACTION ───────────────────────────────────────────────────────────────
function handleClick(n){
  S.sel=n.id;
  if(n.children?.length) n._exp=!n._exp;
  showDetail(n);
  renderAll();
}

// Zoom
function applyZoom(){
  inner.style.transform=`scale(${S.zoom})`;
  inner.style.transformOrigin='top left';
  const w=parseFloat(tsvg.getAttribute('width')||0);
  const h=parseFloat(tsvg.getAttribute('height')||0);
  inner.style.width=w*S.zoom+'px';
  inner.style.height=h*S.zoom+'px';
}
document.getElementById('zi').addEventListener('click',()=>{ S.zoom=Math.min(2,+(S.zoom*1.2).toFixed(2)); applyZoom(); });
document.getElementById('zo').addEventListener('click',()=>{ S.zoom=Math.max(0.3,+(S.zoom/1.2).toFixed(2)); applyZoom(); });
document.getElementById('zr').addEventListener('click',()=>{ S.zoom=1; renderAll(); });

// Expand / Collapse all
function setAll(node,val){
  if(node.children?.length){ node._exp=val; node.children.forEach(c=>setAll(c,val)); }
}
document.getElementById('btn-expand').addEventListener('click',()=>{ setAll(T,true); renderAll(); });
document.getElementById('btn-collapse').addEventListener('click',()=>{
  T.children?.forEach(s=>{ s._exp=true; s.children?.forEach(p=>{ p._exp=false; p.children?.forEach(d=>setAll(d,false)); }); });
  renderAll();
});

// Search
document.getElementById('search').addEventListener('input',e=>{ S.q=e.target.value; renderAll(); });

// Filters
document.querySelectorAll('.chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.f;
    if(S.filters.has(f)){
      S.filters.delete(f); btn.classList.remove('on');
      btn.style.background=''; btn.style.color='';
    } else {
      S.filters.add(f); btn.classList.add('on');
      btn.style.background=btn.dataset.c; btn.style.color='#07090F';
    }
    renderAll();
  });
});

// ── DETAIL ────────────────────────────────────────────────────────────────────
const det=document.getElementById('det');
const TL={'high-salary':'💰 High salary','govt':'🏛 Govt / PSU','abroad':'✈ Global demand','no-math':'∑ No math','exam-free':'🎯 No compet. exam'};

function crumbOf(n){
  const c=[]; let cur=n;
  while(cur){ c.unshift(cur.label); cur=cur._parent; }
  c.shift(); return c;
}

function showDetail(n){
  const crumbs=crumbOf(n);
  const dcrumb=document.getElementById('dcrumb');
  dcrumb.textContent=crumbs.slice(0,-1).join(' › ')||'';
  dcrumb.style.color=n._colorText;

  const ch=n.children||[];
  const leaves=ch.filter(c=>c.kind==='career');
  const branches=ch.filter(c=>c.kind!=='career');

  const collegeInfo = n.kind==='degree' ? COLLEGES[n.id] : null;
  const collegeBlock = collegeInfo ? `
    <div class="dlbl">Score Needed</div><div class="dval mono">${collegeInfo.examScore}</div>
    <div class="dlbl">Top 10 Colleges — India</div><div class="dval">${numList(collegeInfo.india)}</div>
    <div class="dlbl">Top 10 Universities — Global</div><div class="dval">${numList(collegeInfo.global)}</div>
  ` : '';

  const sector = n.kind==='career' ? sectorOf(n) : null;
  const companyInfo = sector ? COMPANIES[sector] : null;
  const companyBlock = companyInfo ? `
    <div class="dlbl">Top 10 Hiring Companies — India</div><div class="dval">${numList(companyInfo.india)}</div>
    <div class="dlbl">Top 10 Hiring Companies — Global</div><div class="dval">${numList(companyInfo.global)}</div>
  ` : '';

  document.getElementById('dcont').innerHTML=`
    <h2 style="color:${n._colorText}">${n.label}</h2>
    ${n.sublabel?`<div class="dsub">${n.sublabel}</div>`:'<div style="height:10px"></div>'}
    ${n.meta?.note?`<div class="dlbl">About</div><div class="dval">${n.meta.note}</div>`:''}
    ${n.meta?.exams?`<div class="dlbl">Key Exams</div><div class="dval mono">${n.meta.exams}</div>`:''}
    ${n.meta?.duration?`<div class="dlbl">Duration</div><div class="dval">${n.meta.duration}</div>`:''}
    ${n.meta?.salary?`<div class="dlbl">Salary Range</div><div class="dval mono">${n.meta.salary}</div>`:''}
    ${collegeBlock}
    ${companyBlock}
    ${n.tags?.length?`<div class="dlbl">Tags</div><div class="dtags">${n.tags.map(t=>`<span class="dtag">${TL[t]||t}</span>`).join('')}</div>`:''}
    ${branches.length?`<div class="dlbl">Sub-paths (${branches.length})</div><div class="dkids">${branches.map(c=>c.label).join(' · ')}</div>`:''}
    ${leaves.length?`<div class="dlbl">Careers (${leaves.length})</div><div class="dkids">${leaves.map(c=>c.label).join(' · ')}</div>`:''}
    ${n.kind==='career'?`<div class="dpath">Stream → ${crumbs[0]||''}<br>${crumbs[1]?`Path → ${crumbs[1]}<br>`:''} ${crumbs[2]?`Degree → ${crumbs[2]}<br>`:''} ${crumbs[3]?`Specialisation → ${crumbs[3]}`:''}</div>`:''}
  `;
  det.classList.add('open');
}
function hideDetail(){
  S.sel=null; det.classList.remove('open'); renderAll();
}
document.getElementById('dclose').addEventListener('click',hideDetail);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideDetail(); });

// ── BOOTSTRAP ─────────────────────────────────────────────────────────────────
renderAll();
window.addEventListener('resize',renderAll);

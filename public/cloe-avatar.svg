<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <clipPath id="cl"><circle cx="40" cy="40" r="40"/></clipPath>
    <radialGradient id="bgG" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="40" cy="40" r="40" fill="url(#bgG)"/>

  <g clip-path="url(#cl)">
    <!-- Shoulders / top of shirt (warm gold, Chloe's energetic palette) -->
    <ellipse cx="40" cy="92" rx="34" ry="22" fill="#fbbf24"/>
    <ellipse cx="40" cy="84" rx="26" ry="16" fill="#f59e0b"/>

    <!-- Neck -->
    <rect x="33" y="57" width="14" height="15" rx="4" fill="#fcd5b0"/>

    <!-- Hair behind head (honey-amber blonde) -->
    <ellipse cx="40" cy="30" rx="25" ry="22" fill="#c8841a"/>

    <!-- Face -->
    <ellipse cx="40" cy="40" rx="20" ry="23" fill="#fcd5b0"/>

    <!-- Hair crown and sides -->
    <ellipse cx="40" cy="19" rx="21" ry="14" fill="#d4961c"/>
    <ellipse cx="21" cy="37" rx="6.5" ry="11" fill="#d4961c"/>
    <ellipse cx="59" cy="37" rx="6.5" ry="11" fill="#d4961c"/>

    <!-- Hair highlights – bright streaks -->
    <ellipse cx="33" cy="17" rx="8"   ry="5.5" fill="#f0c048" opacity="0.55"/>
    <ellipse cx="48" cy="16" rx="6"   ry="4"   fill="#f7d47a" opacity="0.45"/>
    <ellipse cx="22" cy="31" rx="2.5" ry="5"   fill="#e8b840" opacity="0.35"/>

    <!-- Ears -->
    <ellipse cx="21" cy="41" rx="3.5" ry="3"   fill="#f0c8a0"/>
    <ellipse cx="59" cy="41" rx="3.5" ry="3"   fill="#f0c8a0"/>

    <!-- Eyebrows – slightly arched, expressive (intelligence!) -->
    <path d="M26.5 33 Q30.5 30.5 35 32"   stroke="#9a6520" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M45 32   Q49.5 30.5 53.5 33" stroke="#9a6520" stroke-width="1.9" fill="none" stroke-linecap="round"/>

    <!-- Eye whites -->
    <ellipse cx="31" cy="38.5" rx="5.5" ry="4.5" fill="white"/>
    <ellipse cx="49" cy="38.5" rx="5.5" ry="4.5" fill="white"/>

    <!-- Irises – hazel-green (Chloe's alert, curious eyes) -->
    <circle cx="31" cy="38.5" r="3.5" fill="#7a9d50"/>
    <circle cx="49" cy="38.5" r="3.5" fill="#7a9d50"/>

    <!-- Pupils -->
    <circle cx="31" cy="38.5" r="1.9" fill="#1a0e06"/>
    <circle cx="49" cy="38.5" r="1.9" fill="#1a0e06"/>

    <!-- Eye sparkle -->
    <circle cx="32.4" cy="37.2" r="1"   fill="white"/>
    <circle cx="50.4" cy="37.2" r="1"   fill="white"/>
    <circle cx="31.6" cy="39.4" r="0.5" fill="white" opacity="0.5"/>
    <circle cx="49.6" cy="39.4" r="0.5" fill="white" opacity="0.5"/>

    <!-- Nose – delicate -->
    <ellipse cx="37.5" cy="46" rx="1.2" ry="0.9" fill="#e09878" opacity="0.55"/>
    <ellipse cx="42.5" cy="46" rx="1.2" ry="0.9" fill="#e09878" opacity="0.55"/>

    <!-- Mouth – warm confident smile -->
    <path d="M32.5 51.5 Q40 57 47.5 51.5"   stroke="#cc5050" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M34 50.5 Q37.5 49 40 49.5 Q42.5 49 46 50.5" stroke="#cc5050" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Cheek warmth -->
    <ellipse cx="23.5" cy="45" rx="5" ry="3" fill="#f4a0a0" opacity="0.28"/>
    <ellipse cx="56.5" cy="45" rx="5" ry="3" fill="#f4a0a0" opacity="0.28"/>
  </g>

  <!-- Border ring -->
  <circle cx="40" cy="40" r="39" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
</svg>

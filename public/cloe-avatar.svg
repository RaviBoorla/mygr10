<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <clipPath id="cl"><circle cx="40" cy="40" r="40"/></clipPath>
    <radialGradient id="bgG" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </radialGradient>
    <radialGradient id="hairG" cx="40%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#e8c060"/>
      <stop offset="60%" stop-color="#c8841c"/>
      <stop offset="100%" stop-color="#a86010"/>
    </radialGradient>
    <radialGradient id="hairHi" cx="30%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#f5d888" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8c060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="40" cy="40" r="40" fill="url(#bgG)"/>

  <g clip-path="url(#cl)">
    <!-- Shoulders (polka-dot blouse vibe, cream/ivory) -->
    <ellipse cx="40" cy="94" rx="38" ry="20" fill="#f5f0e8"/>
    <ellipse cx="40" cy="88" rx="30" ry="16" fill="#ece4d4"/>

    <!-- === HAIR BACK LAYER (behind everything) === -->
    <!-- Main hair mass — voluminous, reaches low -->
    <ellipse cx="40" cy="34" rx="27" ry="30" fill="url(#hairG)"/>

    <!-- Long wavy sides — left -->
    <path d="M15 32 C10 44 8 58 13 72 C17 76 22 76 24 72 C20 62 18 50 20 40 Z"
          fill="#c8841c"/>
    <!-- Long wavy sides — right -->
    <path d="M65 32 C70 44 72 58 67 72 C63 76 58 76 56 72 C60 62 62 50 60 40 Z"
          fill="#c8841c"/>

    <!-- Wavy curls at bottom-left -->
    <path d="M13 68 C10 74 14 80 20 78 C16 76 13 72 15 68 Z"
          fill="#b87418"/>
    <path d="M18 72 C15 78 20 82 26 80 C22 78 19 74 21 70 Z"
          fill="#c8841c"/>

    <!-- Wavy curls at bottom-right -->
    <path d="M67 68 C70 74 66 80 60 78 C64 76 67 72 65 68 Z"
          fill="#b87418"/>
    <path d="M62 72 C65 78 60 82 54 80 C58 78 61 74 59 70 Z"
          fill="#c8841c"/>

    <!-- Neck -->
    <rect x="33.5" y="58" width="13" height="16" rx="4" fill="#fcd5b0"/>

    <!-- Face -->
    <ellipse cx="40" cy="40" rx="19.5" ry="23" fill="#fcd5b0"/>

    <!-- === HAIR FRONT LAYER (over face edges) === -->
    <!-- Crown / top -->
    <ellipse cx="40" cy="17" rx="22" ry="12" fill="url(#hairG)"/>

    <!-- Front hairline sides (frame the face) -->
    <!-- Left front -->
    <path d="M22 20 C17 26 17 36 20 42 C17 38 15 28 17 20 Z"
          fill="#c8841c"/>
    <!-- Right front -->
    <path d="M58 20 C63 26 63 36 60 42 C63 38 65 28 63 20 Z"
          fill="#c8841c"/>

    <!-- Wavy volume on top-left -->
    <path d="M22 15 C18 18 17 24 20 28 C21 24 22 19 25 17 Z"
          fill="#b87418"/>
    <!-- Wavy volume on top-right -->
    <path d="M58 15 C62 18 63 24 60 28 C59 24 58 19 55 17 Z"
          fill="#b87418"/>

    <!-- Hair highlight overlay -->
    <ellipse cx="35" cy="16" rx="12" ry="7" fill="url(#hairHi)"/>

    <!-- Ears (peeping through hair) -->
    <ellipse cx="21.5" cy="41" rx="3" ry="2.8" fill="#f0c8a0"/>
    <ellipse cx="58.5" cy="41" rx="3" ry="2.8" fill="#f0c8a0"/>

    <!-- === FACE FEATURES === -->

    <!-- Eyebrows — arched, expressive -->
    <path d="M27 32.5 Q31 29.5 35.5 31.5" stroke="#9a6220" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <path d="M44.5 31.5 Q49 29.5 53 32.5"  stroke="#9a6220" stroke-width="1.9" fill="none" stroke-linecap="round"/>

    <!-- Eye whites -->
    <ellipse cx="31.5" cy="38.5" rx="5.5" ry="4.5" fill="white"/>
    <ellipse cx="48.5" cy="38.5" rx="5.5" ry="4.5" fill="white"/>

    <!-- Irises — hazel/green -->
    <circle cx="31.5" cy="38.5" r="3.5" fill="#7a9d50"/>
    <circle cx="48.5" cy="38.5" r="3.5" fill="#7a9d50"/>

    <!-- Pupils -->
    <circle cx="31.5" cy="38.5" r="1.9" fill="#180e06"/>
    <circle cx="48.5" cy="38.5" r="1.9" fill="#180e06"/>

    <!-- Sparkle -->
    <circle cx="32.9" cy="37.1" r="1"   fill="white"/>
    <circle cx="50.0" cy="37.1" r="1"   fill="white"/>
    <circle cx="32.0" cy="39.5" r="0.5" fill="white" opacity="0.45"/>
    <circle cx="49.0" cy="39.5" r="0.5" fill="white" opacity="0.45"/>

    <!-- Nose — delicate -->
    <ellipse cx="37.5" cy="46" rx="1.1" ry="0.9" fill="#e09878" opacity="0.5"/>
    <ellipse cx="42.5" cy="46" rx="1.1" ry="0.9" fill="#e09878" opacity="0.5"/>

    <!-- Smile — warm, confident -->
    <path d="M32.5 51.5 Q40 57 47.5 51.5"  stroke="#c85050" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M34 50.5 Q37.5 49 40 49.5 Q42.5 49 46 50.5" stroke="#c85050" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Cheek warmth -->
    <ellipse cx="23.5" cy="45" rx="4.5" ry="2.8" fill="#f4a0a0" opacity="0.25"/>
    <ellipse cx="56.5" cy="45" rx="4.5" ry="2.8" fill="#f4a0a0" opacity="0.25"/>
  </g>

  <!-- Border ring -->
  <circle cx="40" cy="40" r="39" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
</svg>

    <script defer src="family.js?v=8"></script>
    <script defer src="challenge.js?v=1"></script>
    <script defer src="live-room.js?v=1"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => { app.init(); });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
          navigator.serviceWorker.addEventListener('message', e => {
            if (e.data && e.data.type === 'SW_UPDATED') {
              const toast = document.createElement('div');
              toast.id = 'sw-toast';
              toast.textContent = '✦ App updated — tap to reload';
              Object.assign(toast.style, {
                position:'fixed', bottom:'72px', left:'50%', transform:'translateX(-50%)',
                background:'#1e293b', color:'#fff', padding:'10px 18px',
                borderRadius:'20px', fontSize:'13px', fontFamily:'inherit',
                zIndex:'9999', cursor:'pointer', whiteSpace:'nowrap',
                boxShadow:'0 4px 16px rgba(0,0,0,.25)'
              });
              toast.onclick = () => location.reload();
              document.body.appendChild(toast);
            }
          });
        });
      }
    </script>
</body>
